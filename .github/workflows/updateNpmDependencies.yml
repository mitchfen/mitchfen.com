name: Update npm dependencies

on:
  schedule:
    - cron: "0 14 * * 5"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: npm-dependency-updates
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  update:
    name: Update dependencies
    runs-on: ubuntu-latest
    env:
      UPDATE_BRANCH: automated/npm-dependency-updates
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "26"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Report outdated dependencies
        run: npm outdated || true

      - name: Upgrade dependencies
        run: npm run dependencies:update

      - name: Check for updates
        id: changes
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
          else
            echo "updated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.changes.outputs.updated == 'true'
        run: npm run build

      - name: Push update branch
        if: steps.changes.outputs.updated == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$UPDATE_BRANCH"
          git add package.json package-lock.json
          git commit -m "Update npm dependencies"
          git fetch origin "$UPDATE_BRANCH:refs/remotes/origin/$UPDATE_BRANCH" || true
          git push --force-with-lease origin "HEAD:$UPDATE_BRANCH"

      - name: Open pull request
        if: steps.changes.outputs.updated == 'true'
        env:
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ -z "$(gh pr list --head "$UPDATE_BRANCH" --base "$BASE_BRANCH" --state open --json number --jq '.[0].number')" ]]; then
            gh pr create \
              --base "$BASE_BRANCH" \
              --head "$UPDATE_BRANCH" \
              --title "Update npm dependencies" \
              --body "Automated weekly update of all npm dependencies, including major versions. The lockfile was regenerated and the site build completed successfully."
          fi
